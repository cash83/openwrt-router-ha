kick_client:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    ban_seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    entry_id:
      selector:
        config_entry:
          integration: openwrt_router

block_client:
  fields:
    mac:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    blocked:
      required: true
      selector:
        boolean:
    entry_id:
      selector:
        config_entry:
          integration: openwrt_router
